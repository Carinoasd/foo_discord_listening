name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: tests/run.sh

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.arch }}
          path: build/foo_discord_listening.dll
          if-no-files-found: error

  package:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: python3 scripts/package.py --x64 artifacts/dll-x64/foo_discord_listening.dll --x86 artifacts/dll-x86/foo_discord_listening.dll --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: fb2k-component
          path: dist/*.fb2k-component
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先寫成檔案：process substitution 裡的失敗不會讓 step 失敗，
          # tag 與 VERSION 不一致或 CHANGELOG 缺段落時必須在這裡中止。
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.fb2k-component \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
